name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

  build:
    name: Build
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=videos-pr-amd64
          cache-to: type=gha,mode=max,scope=videos-pr-amd64

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject stale workflow runs
        run: |
          git fetch --no-tags origin main
          CURRENT_MAIN=$(git rev-parse FETCH_HEAD)
          if [ "$GITHUB_SHA" != "$CURRENT_MAIN" ]; then
            echo "::error::Refusing to release stale commit ${GITHUB_SHA}; current main is ${CURRENT_MAIN}."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/videos
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          EXISTING_TAG=$(git tag --points-at "$GITHUB_SHA" --sort=-v:refname | sed -n -E '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sed -n '1p')
          LATEST_TAG=$(git tag --sort=-v:refname | sed -n -E '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sed -n '1p')

          if [ -n "$EXISTING_TAG" ]; then
            VERSION=$EXISTING_TAG
            PREVIOUS_TAG=$(git tag --sort=-v:refname | sed -n -E '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | grep -Fxv "$VERSION" | sed -n '1p' || true)
          elif [ -n "$LATEST_TAG" ]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            PREVIOUS_TAG=$LATEST_TAG
          else
            VERSION=v1.0.0
            PREVIOUS_TAG=
          fi

          SHORT_SHA=${GITHUB_SHA::7}
          {
            echo "version=${VERSION}"
            echo "previous=${PREVIOUS_TAG}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:${SHORT_SHA},${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          REPO="https://github.com/${{ github.repository }}"
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"
            CHANGELOG_URL="${REPO}/compare/${PREVIOUS_TAG}...${VERSION}"
          else
            RANGE="HEAD"
            CHANGELOG_URL="${REPO}/commits/${VERSION}"
          fi

          BODY=""
          declare -A SECTIONS
          declare -a ORDER
          while IFS='|' read -r MSG SHORTHASH FULLHASH AUTHOR_EMAIL; do
            [ -z "$MSG" ] && continue
            TYPE=$(echo "$MSG" | sed -n 's/^\([a-z]*\)\(([^)]*)\)\?: .*/\1/p')
            [ -z "$TYPE" ] && TYPE="other"
            STRIPPED=$(echo "$MSG" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //')
            AUTHOR_LOGIN=""
            case "$AUTHOR_EMAIL" in
              *+*@users.noreply.github.com)
                AUTHOR_LOGIN="${AUTHOR_EMAIL#*+}"
                AUTHOR_LOGIN="${AUTHOR_LOGIN%@users.noreply.github.com}"
                ;;
              *@users.noreply.github.com)
                AUTHOR_LOGIN="${AUTHOR_EMAIL%@users.noreply.github.com}"
                ;;
            esac
            AUTHOR_SUFFIX=""
            if [ -n "$AUTHOR_LOGIN" ] && [ "$AUTHOR_LOGIN" != "noreply" ]; then
              AUTHOR_SUFFIX=" @${AUTHOR_LOGIN}"
            fi
            LINE="- ${STRIPPED} ([${SHORTHASH}](${REPO}/commit/${FULLHASH}))${AUTHOR_SUFFIX}"
            if [ -z "${SECTIONS[$TYPE]+x}" ]; then
              ORDER+=("$TYPE")
            fi
            SECTIONS[$TYPE]="${SECTIONS[$TYPE]}${LINE}"$'\n'
          done <<< "$(git log "$RANGE" --pretty=format:"%s|%h|%H|%ae" --no-merges)"

          for TYPE in "${ORDER[@]}"; do
            BODY="${BODY}### ${TYPE}"$'\n'"${SECTIONS[$TYPE]}"$'\n'
          done

          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo "$BODY"
            echo "**Full Changelog**: ${CHANGELOG_URL}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=videos-release-amd64
            type=gha,scope=videos-pr-amd64
          cache-to: type=gha,mode=max,scope=videos-release-amd64

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.body }}
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    uses: wajeht/docker-cd-deploy-workflow/.github/workflows/deploy.yaml@970a4d7bd568e096d091fbec3371019c763def1f # v0.0.26
    with:
      app-path: apps/videos
      service-name: videos
      tag: ${{ needs.release.outputs.version }}
      url: https://videos.jaw.dev
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  temp-build:
    name: Temp Build
    if: >
      (github.event.action == 'labeled' &&
      (github.event.label.name == 'temp-deploy' ||
      github.event.label.name == 'temp-deploy-with-auth')) ||
      (github.event.action == 'synchronize' &&
      (contains(github.event.pull_request.labels.*.name, 'temp-deploy') ||
      contains(github.event.pull_request.labels.*.name, 'temp-deploy-with-auth')))
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      tag: ${{ steps.image-name.outputs.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Generate image name
        id: image-name
        run: |
          TAG=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)
          IMAGE_URL=$(echo ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:$TAG | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_URL=$IMAGE_URL" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image-name.outputs.IMAGE_URL }}
          build-args: APP_VERSION=${{ steps.image-name.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  temp-deploy:
    name: Temp Deploy
    if: >
      (github.event.action == 'labeled' &&
      (github.event.label.name == 'temp-deploy' ||
      github.event.label.name == 'temp-deploy-with-auth')) ||
      (github.event.action == 'synchronize' &&
      (contains(github.event.pull_request.labels.*.name, 'temp-deploy') ||
      contains(github.event.pull_request.labels.*.name, 'temp-deploy-with-auth')))
    needs: temp-build
    permissions:
      deployments: write
    uses: wajeht/docker-cd-deploy-workflow/.github/workflows/temp-deploy.yaml@970a4d7bd568e096d091fbec3371019c763def1f # v0.0.26
    with:
      app-path: apps/videos
      service-name: videos
      tag: ${{ needs.temp-build.outputs.tag }}
      auth-middleware: ${{ contains(github.event.pull_request.labels.*.name, 'temp-deploy-with-auth') && 'oauth2-admin@file' || '' }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  temp-cleanup:
    name: Temp Cleanup
    if: >
      github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' &&
      (github.event.label.name == 'temp-deploy' ||
      github.event.label.name == 'temp-deploy-with-auth') &&
      !contains(github.event.pull_request.labels.*.name, 'temp-deploy') &&
      !contains(github.event.pull_request.labels.*.name, 'temp-deploy-with-auth'))
    permissions:
      deployments: write
    uses: wajeht/docker-cd-deploy-workflow/.github/workflows/temp-cleanup.yaml@970a4d7bd568e096d091fbec3371019c763def1f # v0.0.26
    with:
      app-path: apps/videos
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
